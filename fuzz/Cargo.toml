[package]
name = "jose-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
jose-rs = { path = "..", features = ["post-quantum"] }
kryptering = { version = "0.7", default-features = false, features = ["rustcrypto", "post-quantum"] }

[[bin]]
name = "base64url_decode"
path = "fuzz_targets/base64url_decode.rs"
test = false
doc = false
bench = false

